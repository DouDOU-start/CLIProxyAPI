services:
  postgres:
    image: postgres:16
    container_name: ${CLI_PROXY_POSTGRES_CONTAINER:-cli-proxy-postgres}
    entrypoint:
      - /bin/bash
      - /bootstrap/docker-postgres-entrypoint.sh
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/bootstrap/config.yaml:ro
      - ./docker-postgres-entrypoint.sh:/bootstrap/docker-postgres-entrypoint.sh:ro
      - ${CLI_PROXY_DATA_PATH:-./data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "/bin/bash", "/bootstrap/docker-postgres-entrypoint.sh", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: ${CLI_PROXY_API_CONTAINER:-cli-proxy-api}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "${CLI_PROXY_PORT:-8317}:${CLI_PROXY_PORT:-8317}"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
